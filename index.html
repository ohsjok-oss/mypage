<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ohsjok-oss</title>
<meta name="description" content="춤추는 병아리와 함께하는 ohsjok-oss 소개 페이지">
<style>
  :root {
    --sky-top: #fff7d6;
    --sky-bottom: #ffe1ec;
    --card-bg: rgba(255, 255, 255, 0.82);
    --card-border: rgba(255, 255, 255, 0.9);
    --text: #3b2f1e;
    --muted: #7a6a55;
    --accent: #f4a300;
    --chick: #ffd23f;
    --chick-shade: #f6b81f;
    --beak: #ff8c2b;
    --cheek: #ff9fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sky-top: #1d2240;
      --sky-bottom: #3a2a4a;
      --card-bg: rgba(30, 28, 45, 0.78);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f6efe2;
      --muted: #c9bda8;
      --accent: #ffc94a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    line-height: 1.6;
  }

  /* ---------- 배경에 고정된 애니메이션 ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 22vh;
    background: radial-gradient(120% 100% at 50% 100%, #9bd770 0%, #7cc35a 60%, transparent 61%);
    opacity: 0.9;
  }
  .note {
    position: absolute;
    bottom: 30vh;
    font-size: 28px;
    color: var(--accent);
    opacity: 0;
    animation: float 4s ease-in infinite;
  }
  .note:nth-child(2) { left: 22%; animation-delay: 0s; }
  .note:nth-child(3) { left: 70%; animation-delay: 1.3s; }
  .note:nth-child(4) { left: 40%; animation-delay: 2.6s; }
  .note:nth-child(5) { left: 82%; animation-delay: 3.4s; }
  @keyframes float {
    0%   { transform: translateY(0) rotate(0); opacity: 0; }
    15%  { opacity: 0.9; }
    100% { transform: translateY(-50vh) rotate(25deg); opacity: 0; }
  }

  .chick-wrap {
    position: absolute;
    left: 50%;
    bottom: 12vh;
    width: min(46vw, 260px);
    transform: translateX(-50%);
  }
  .chick {
    width: 100%;
    display: block;
    transform-origin: 50% 95%;
    animation: dance 1.2s ease-in-out infinite;
  }
  .shadow {
    width: 70%;
    height: 18px;
    margin: -10px auto 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.15);
    animation: shadow 0.6s ease-in-out infinite alternate;
  }
  @keyframes dance {
    0%   { transform: translateY(0) rotate(-8deg) scale(1, 1); }
    25%  { transform: translateY(-18%) rotate(0deg) scale(0.96, 1.05); }
    50%  { transform: translateY(0) rotate(8deg) scale(1.06, 0.94); }
    75%  { transform: translateY(-18%) rotate(0deg) scale(0.96, 1.05); }
    100% { transform: translateY(0) rotate(-8deg) scale(1, 1); }
  }
  @keyframes shadow {
    from { transform: scaleX(1); opacity: 0.9; }
    to   { transform: scaleX(0.7); opacity: 0.5; }
  }
  .wing-l { transform-origin: 62px 120px; animation: flapL 0.6s ease-in-out infinite alternate; }
  .wing-r { transform-origin: 138px 120px; animation: flapR 0.6s ease-in-out infinite alternate; }
  @keyframes flapL { from { transform: rotate(10deg); } to { transform: rotate(-35deg); } }
  @keyframes flapR { from { transform: rotate(-10deg); } to { transform: rotate(35deg); } }
  .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  .feet { animation: tap 0.6s steps(2) infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes tap { 50% { transform: translateY(-3px); } }

  @media (prefers-reduced-motion: reduce) {
    .chick, .shadow, .wing-l, .wing-r, .eye, .feet, .note { animation: none; }
  }

  /* ---------- 위에 올라가는 내용 카드 ---------- */
  main {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 16px 60vh;
    display: grid;
    gap: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }
  h1 { margin: 0 0 4px; font-size: clamp(28px, 6vw, 40px); }
  h2 { margin: 0 0 8px; font-size: 20px; }
  .lead { margin: 0; color: var(--muted); }
  ul { margin: 0; padding-left: 20px; }
  a { color: var(--accent); font-weight: 600; }
  footer { text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <div class="ground"></div>
  <span class="note">♪</span>
  <span class="note">♫</span>
  <span class="note">♪</span>
  <span class="note">♬</span>

  <div class="chick-wrap">
    <svg class="chick" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- 머리 깃털 -->
      <path d="M96 30 q-6 -16 6 -20 q-2 10 6 14 q6 -10 14 -6 q-10 4 -10 14 z" fill="#ffd23f"/>
      <!-- 날개 -->
      <ellipse class="wing-l" cx="44" cy="118" rx="22" ry="30" fill="#f6b81f"/>
      <ellipse class="wing-r" cx="156" cy="118" rx="22" ry="30" fill="#f6b81f"/>
      <!-- 통통한 몸 -->
      <ellipse cx="100" cy="110" rx="66" ry="70" fill="#ffd23f"/>
      <ellipse cx="100" cy="135" rx="40" ry="34" fill="#ffe17a"/>
      <!-- 눈 -->
      <ellipse class="eye" cx="78" cy="92" rx="7" ry="9" fill="#2b2118"/>
      <ellipse class="eye" cx="122" cy="92" rx="7" ry="9" fill="#2b2118"/>
      <circle cx="80" cy="89" r="2.4" fill="#fff"/>
      <circle cx="124" cy="89" r="2.4" fill="#fff"/>
      <!-- 볼 -->
      <ellipse cx="64" cy="112" rx="10" ry="6" fill="#ff9fb0" opacity="0.8"/>
      <ellipse cx="136" cy="112" rx="10" ry="6" fill="#ff9fb0" opacity="0.8"/>
      <!-- 부리 -->
      <path d="M88 104 L112 104 L100 120 Z" fill="#ff8c2b"/>
      <!-- 발 -->
      <g class="feet" fill="#ff8c2b">
        <path d="M76 176 l-10 12 h8 l4 -6 l4 6 h8 l-10 -12 z"/>
        <path d="M124 176 l-10 12 h8 l4 -6 l4 6 h8 l-10 -12 z"/>
      </g>
    </svg>
    <div class="shadow"></div>
  </div>
</div>

<main>
  <section class="card">
    <h1>안녕하세요! 🐥</h1>
    <p class="lead">ohsjok-oss의 홈페이지에 오신 걸 환영해요.</p>
  </section>

  <section class="card">
    <h2>소개</h2>
    <p>여기에 자기소개를 적어 주세요. 하는 일, 좋아하는 것, 요즘 관심 있는 것 등을 자유롭게 써도 좋아요.</p>
  </section>

  <section class="card">
    <h2>하고 있는 일</h2>
    <ul>
      <li>프로젝트 1 — 간단한 설명</li>
      <li>프로젝트 2 — 간단한 설명</li>
      <li>프로젝트 3 — 간단한 설명</li>
    </ul>
  </section>

  <section class="card">
    <h2>연락처</h2>
    <p>GitHub: <a href="https://github.com/ohsjok-oss">github.com/ohsjok-oss</a></p>
  </section>

  <footer>© ohsjok-oss · 병아리가 오늘도 춤추는 중 🎵</footer>
</main>

</body>
</html>
